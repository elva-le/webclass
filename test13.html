<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Task 2 - Filter Effect</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 30px;
    }

    .container {
      display: flex;
      justify-content: center;
      gap: 50px;
    }

    .item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 头像圆形容器 */
    .avatar-wrapper {
      position: relative;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      overflow: hidden;
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 右侧模糊滤镜 */
    .avatar-wrapper.filter2 img {
      filter: blur(4px);
      -webkit-filter: blur(4px);
      transform: scale(1.05); /* 轻微放大防止模糊边缘产生白边 */
    }

    /* 右侧图片上的粉色文字 */
    .avatar-wrapper .overlay-text {
      position: absolute;
      bottom: 45px;
      left: 50%;
      transform: translateX(-50%);
      color: #e08bbf;
      font-size: 24px;
      font-family: Georgia, serif;
      pointer-events: none;
      white-space: nowrap;
    }

    .caption {
      margin-top: 15px;
      font-size: 22px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Task 2</h1>

  <div class="container">
    <!-- Filter 1 -->
    <div class="item">
      <div class="avatar-wrapper">
        <img src="images/brad pitt.jpg" alt="Brad Pitt">
      </div>
      <div class="caption">Filter1</div>
    </div>

    <!-- Filter 2 -->
    <div class="item">
      <div class="avatar-wrapper filter2">
        <img src="images/brad pitt.jpg" alt="Brad Pitt">
        <div class="overlay-text">Brad Pitt</div>
      </div>
      <div class="caption">Filter2</div>
    </div>
  </div>

</body>
</html>
