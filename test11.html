<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Task 1</title>
    <style>
        img{
            border: 5px solid#555;
        }
        img.b{
            filter: sepia(80%);
            -webkit-filter: sepia(80%);
        }
    </style>
</head>
<body>
    <p>Apply an effect to make the right image:</p>
    <img class="a" src="/images/lena.png" width="300" height="300" alt="original">
    <img class="b" src="/images/lena.png" width="300" height="300" alt="after">
    <p><strong>Note:</strong>The filter proprety is not supported in Internet Explorer, Edge 12, or Safari 5.1 and earlier.</p>
    
</body>
</html>
