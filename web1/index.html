<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exercise</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #ffffff;
    }

    h1 {
      font-size: 3rem;
      font-weight: normal;
      margin-bottom: 25px;
    }

    .exercise-box {
      border: 1px dashed #9e9e9e;
      padding: 18px;
      max-width: 800px;
      box-sizing: border-box;
    }

    nav {
      background-color: #007a00;
      width: 100%;
    }

    ul.navbar-list {
      list-style-type: none;
      margin: 0;
      padding: 0;
      display: flex;
    }

    ul.navbar-list > li {
      margin: 0;
      padding: 0;
    }

    ul.navbar-list > li > a {
      display: block;
      padding: 12px 22px;
      font-family: "Times New Roman", Times, serif;
      font-size: 17px;
      color: #bbf846;
      background-color: #007a00;
      cursor: pointer;
      text-decoration-line: underline;
      text-decoration-style: wavy;
      text-decoration-color: #ffffff;
      text-decoration-thickness: 1.5px;
      text-underline-offset: 4px;
    }

    ul.navbar-list > li > a:hover {
      background-color: #009900;
    }

    ul.navbar-list > li > a:active {
      background-color: #1a081a;
      color: #ffeb3b;
    }

    ul.menu-list {
      list-style-type: square;
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      line-height: 1.5;
      margin-top: 25px;
      padding-left: 40px;
      color: #000000;
    }

    ul.menu-list > li {
      margin-bottom: 4px;
    }

    ul.menu-list ul {
      list-style-type: circle;
      padding-left: 24px;
      margin-top: 4px;
      margin-bottom: 4px;
    }

    ul.menu-list ul li {
      margin-bottom: 3px;
    }
  </style>
</head>
<body>

  <h1>Exercise</h1>

  <div class="exercise-box">
    <nav>
      <ul class="navbar-list">
        <li><a href="index.html">Home</a></li>
        <li><a href="news/news.html">News</a></li>
        <li><a href="contact/contact.html">Contact</a></li>
        <li><a href="schedule/schedule.html">Schedule</a></li>
        <li><a href="about/about.html">About</a></li>
      </ul>
    </nav>

    <ul class="menu-list">
      <li>Mousses</li>
      <li>
        Pastries
        <ul>
          <li>Croissant</li>
          <li>Milles-feuille</li>
          <li>Palmier</li>
          <li>Profiteroles</li>
        </ul>
      </li>
      <li>Tarts</li>
    </ul>
  </div>

</body>
</html>
