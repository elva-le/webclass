<!DOCTYPE html>
<html>
<head>

<style>
div.content {
    background-color: lightblue;
    border: 3px;
    resize: both;
    overflow: auto;
}

div.blue {
    float: right;
    background-color: #1faadb;
    width: 50%;
}

div.green {
    float: left;
    background-color: #8ebf42;
    width: 50%;
}
</style>

</head>

<body>

<h1>Div side by side</h1>

<div class="content">

    <div class="blue">
        <p>This is some paragraph inside div tag.</p>

        <ul>
            <li>List item 1</li>
            <li>List item 2</li>
        </ul>
    </div>

    <div class="green">
        <p>This is some paragraph inside div tag.</p>

        <ol>
            <li>List item 1</li>
            <li>List item 2</li>
        </ol>
    </div>

</div>

</body>
</html>
