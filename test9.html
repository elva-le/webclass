<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 1 - Image Overlay Fade</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f7f7f7;
      margin: 0;
    }

    .container {
      position: relative;
      width: 280px;
      height: 280px;
      border-radius: 50%; 
      overflow: hidden; 
    }

    .image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .overlay {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      height: 100%;
      width: 100%;
      opacity: 0; 
      transition: opacity 0.5s ease; 
      background-color: #a4507b; 
      
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 25px;  
      box-sizing: border-box;
    }

    .container:hover .overlay {
      opacity: 1;
    }

    .text {
      color: #fde8df; 
      font-size: 24px;
      font-family: "Georgia", serif;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-align: center;
      user-select: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="images/anyujin.jpg" alt="Anyujin" class="image">
    <div class="overlay">
      <div class="text">Anyujin</div>
    </div>
  </div>

</body>
</html>
